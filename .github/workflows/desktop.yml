# 데스크톱 산출물 — Studio·PC 실행기를 PyInstaller onedir로 묶는다 (ADR-0024).
#
# **푸시마다 돌지 않는다.** 묶는 데 몇 분이 걸리고(스파이크 S5: onedir 77초, WebEngine 포함
# 143초) 모든 PR에 붙으면 CI 비용이 커진다. 사람이 단추로 돌리거나 태그를 밀 때만 돈다.
#
# 보는 것은 둘이다 — **Windows에서 정말 묶이나**, 그리고 **묶은 앱이 제 확장을 들고 있나**
# (`--selftest`, ADR-0024의 빌드 검사. 확장이 빠지면 실행 중에야 드러난다).
#
# **Windows에서는 설치 파일까지 만든다** (ADR-0068 — Inno Setup, 사용자별, 서명 없음). 그리고
# 그 설치 파일을 **조용히 설치 → 설치된 앱 검사 → 조용히 제거**까지 해 본다(`--check-install`).
# 같은 앱의 설치를 덮으므로 러너에서만 한다.
name: 데스크톱 산출물

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "묶을 앱 (비우면 둘 다)"
        required: false
        default: ""
        type: choice
        options: ["", "bot-ui", "studio"]
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: 묶기 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows가 주 환경이다 (CLAUDE.md §5). Linux도 묶어 **빌드 자체가 서는지**를 본다 —
        # 개발 PC에서 돌리는 것과 같은 길이라 여기서 깨지면 사람도 깨진다.
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: uv 설치
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Python 3.12 (uv 관리형)
        run: uv python install

      # `--group build`가 PyInstaller를 들여온다 (평소 `uv sync`에는 없다).
      - name: 의존성
        run: uv sync --all-packages --group build --frozen

      # Qt를 화면 없이 띄울 수 있게 (셀프테스트는 창을 만들지 않지만 Qt를 import한다).
      - name: Qt 런타임 라이브러리 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libasound2t64

      # 러너 이미지에 Inno Setup 6이 없으면 깐다 (있으면 그대로 쓴다).
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $found = Get-Command iscc -ErrorAction SilentlyContinue
          $default = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not $found -and -not (Test-Path $default)) { choco install innosetup -y --no-progress }

      # **확장이 다 들어갔는지 빌드가 스스로 본다** — `--want`로 이름을 못 박는다.
      # 내장 확장은 `ui-automation` 하나다 (사내 확장이 생기면 여기 쉼표로 늘어난다).
      # **판은 태그가 정한다** (ADR-0067) — 태그로 돌면 그 이름을 넘긴다(얕은 체크아웃에서 태그를
      # 찾느라 헤매지 않는다). 단추로 돌리면 빌드가 `<core 판>+g<커밋>`을 찍는다.
      - name: 묶기 + 빌드 검사
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INSTALLER: ${{ runner.os == 'Windows' && '--installer --check-install' || '' }}
        run: uv run --group build python packaging/build.py ${{ inputs.apps }} --want ui-automation ${VERSION:+--version "$VERSION"} $INSTALLER

      - name: 산출물 올리기
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: build/dist
          retention-days: 7
          # 큰 폴더다 (Studio 약 550MB) — 압축을 낮춰 올리는 시간을 줄인다.
          compression-level: 1

      # 설치 파일 — 사람이 현장 PC에 넣는 것은 이것이다 (이미 압축돼 있다).
      - name: 설치 파일 올리기 (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: build/installer
          retention-days: 30
          compression-level: 0
