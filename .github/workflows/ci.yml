# CI — Windows 클라이언트 + Linux 서버 조합에서 확인한다 (docs/05-roadmap.md 원칙:
# "내 PC에서 된다"는 완료가 아니다).
#
# 러너는 GitHub이 띄우는 VM이다. ubuntu-latest는 x86_64, windows-latest는 Windows Server다.
# 개발 PC(aarch64 Linux)와 다른 환경이라, 여기서 처음 드러나는 문제가 있다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 앞의 실행을 끊는다 (무료 한도 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 한쪽이 깨져도 다른 쪽 결과를 봐야 한다
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Python은 uv가 내려받는다 (.python-version = 3.12, ADR-0005).
      # PYTHONUTF8은 **일부러 켜지 않는다** — Windows 기본 인코딩에서 돌려야
      # `encoding="utf-8"`을 빠뜨린 곳이 드러난다 (CLAUDE.md §5).
      #
      # setup-uv는 떠 있는 메이저 태그(v10)가 없어 정확한 버전으로 고정한다.
      # 올릴 때는 이 줄을 손으로 고친다.
      - name: uv 설치
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Python 3.12 (uv 관리형)
        run: uv python install

      # --frozen: uv.lock을 그대로 쓴다. lock이 pyproject와 어긋나면 여기서 멈춘다.
      - name: 의존성
        run: uv sync --all-packages --frozen

      # Qt는 화면 없이 돌려도(offscreen) 시스템 그래픽 라이브러리가 필요하다. 러너 이미지에
      # 없는 것만 깐다. Windows 러너는 필요 없다 (Qt 런타임이 휠에 들어 있다).
      # Studio 캔버스는 QtWebEngine이다 (ADR-0022) — Chromium이 쓰는 것이 Qt보다 더 많다.
      # 없으면 캔버스 시험이 건너뛰어지므로(조용히 안 도는 것보다 나쁘다) 여기서 깐다.
      - name: Qt·WebEngine 런타임 라이브러리 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libnss3 libnspr4 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 \
            libxkbfile1 libxtst6 libcups2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1

      - name: 테스트
        run: uv run pytest

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      # OS 분기는 한쪽만 검사된다 (mypy가 `sys.platform` 비교로 다른 쪽을 지운다). Windows 작업이
      # 네이티브로 보지만, Linux에서도 Windows 쪽을 함께 봐서 더 빨리 걸리게 한다.
      - name: mypy (Windows 쪽 분기)
        run: uv run mypy --platform win32

      # 생성물이 원본과 어긋나면 멈춘다. 둘 다 아무것도 쓰지 않고 검사만 한다.
      - name: 계약 JSON Schema 최신 여부
        run: uv run python scripts/gen_schemas.py --check

      # Studio 캔버스가 `chk:*`를 타입으로 다루는 설명 (ADR-0022·0029 §3).
      - name: bpmn-moddle 설명 최신 여부
        run: uv run python scripts/gen_moddle.py --check

      # 확장이 기여한 콘솔 화면 목록 (ADR-0042 §2 — 콘솔이 손으로 베끼지 않는다).
      - name: 콘솔 화면 기여 목록 최신 여부
        run: uv run python scripts/gen_console_pages.py --check

      - name: 업무 예제 생성물 최신 여부
        run: uv run python docs/08-business-examples/_source/build.py --check

      # 명암비 검사도 이 안에서 돈다 (기준을 깨는 색이 들어오면 1로 끝난다).
      - name: 디자인 토큰 생성물 최신 여부
        run: uv run python scripts/gen_tokens.py --check

      # 작업 트리가 더러워졌다면 생성물을 커밋하지 않은 것이다 (--check가 놓친 경우).
      - name: 작업 트리가 깨끗한가
        run: git diff --exit-code

  # 웹 화면 (ADR-0017). 파이썬 쪽과 따로 돈다 — 도구가 둘(uv + pnpm)이다.
  web:
    name: 웹 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 web/package.json의 packageManager가 정한다 (한 곳에서만 올린다).
      # `defaults.run.working-directory`는 `run` 단계에만 걸리고 **액션 입력에는 걸리지 않는다** —
      # 경로를 적지 않으면 저장소 루트의 package.json을 찾다가 멈춘다.
      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Node.js LTS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile: lock이 package.json과 어긋나면 여기서 멈춘다 (uv --frozen과 같은 뜻).
      - name: 의존성
        run: pnpm install --frozen-lockfile

      # 계약 스키마에서 생성한 타입이 최신인가. 스키마 자체의 최신 여부는 Python 쪽이 본다.
      - name: 계약 타입 최신 여부
        run: pnpm check:api-types

      # Studio 안으로 복사해 둔 bpmn-js 배포본이 고정한 판과 같은가 (ADR-0029).
      # 파이썬 쪽에는 Node가 없으므로 **여기서** 본다.
      - name: bpmn-js 배포본 최신 여부
        run: pnpm check:bpmn-canvas

      - name: 타입 검사
        run: pnpm typecheck

      - name: 빌드
        run: pnpm build

      - name: 작업 트리가 깨끗한가
        run: git diff --exit-code
