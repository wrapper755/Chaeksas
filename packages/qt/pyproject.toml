[project]
name = "chaeksas-qt"
version = "0.1.0"
description = "공용 PySide6 위젯·테마·결재 창 (토큰에서 생성한 QSS를 쓴다)"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# chaeksas는 PEP 420 네임스페이스 — src/chaeksas 밑에 __init__.py를 두지 않는다
packages = ["src/chaeksas"]
