[project]
name = "chaeksas-core"
version = "0.1.0"
description = "런타임 코어 — BPMN 실행, 확장 호스트, AI 태스크, 도구, 재생 기억, 설정 로더"
requires-python = ">=3.12,<3.13"
dependencies = ["chaeksas-extension-api"]

[tool.uv.sources]
chaeksas-extension-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# chaeksas는 PEP 420 네임스페이스 — src/chaeksas 밑에 __init__.py를 두지 않는다
packages = ["src/chaeksas"]
