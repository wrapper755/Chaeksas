# 서버 구성 한 번에 (M2 완료 기준). `docs/04-setup.md` §6의 포트를 그대로 쓴다.
#
#   cd deploy
#   cp .env.example .env     # 토큰을 채운다 (비밀은 저장소에 넣지 않는다)
#   docker compose up -d
#
# 서비스 앱 관리 콘솔(`svc-console`)은 **서비스 앱마다 하나**다 — 여기서는 UI 자동화 앱 하나를
# 가리킨다 (`CHK_SVC_CONSOLE__APP_URL`). Neo4j·LLM 게이트웨이는 계획 생성(C8)과 함께 온다.
name: chaeksas

services:
  center:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.center
    environment:
      # 비밀은 `.env`에서 온다 (compose 파일에 적지 않는다).
      CHK_CENTER__ADMIN_TOKEN: ${CHK_CENTER__ADMIN_TOKEN:?관리자 토큰을 .env에 넣으세요}
      CHK_CENTER__READ_TOKEN: ${CHK_CENTER__READ_TOKEN:-}
      CHK_CENTER__PORT: "8800"
    ports:
      # 컨테이너 안의 포트는 문서의 기본값 그대로 두고, **호스트 쪽만** 바꿀 수 있게 한다
      # (한 PC에서 프로토타입과 같이 띄우면 겹친다 — `docs/04-setup.md` §6의 주의).
      - "${CHK_CENTER__HOST_PORT:-8800}:8800"
    volumes:
      - center-data:/data
    restart: unless-stopped

  center-console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
      args:
        APP: center-console
    environment:
      # 콘솔은 **컨테이너 이름**으로 Center를 부른다 (브라우저가 아니라 콘솔 서버가 부르기 때문에
      # localhost가 아니다, ADR-0017 §1).
      CHK_CONSOLE__CENTER_URL: http://center:8800
      CHK_CONSOLE__SESSION_SECRET: ${CHK_CONSOLE__SESSION_SECRET:?세션 비밀을 .env에 넣으세요 (16자 이상)}
      PORT: "8501"
    ports:
      - "${CHK_CONSOLE__HOST_PORT:-8501}:8501"
    depends_on:
      - center
    restart: unless-stopped

  svc-uia:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.svc-uia
    environment:
      # 관리 API(SVC-00~03)는 **이 토큰이 있어야** 열린다. 없으면 503이다 (C11).
      CHK_SVC_UI_AUTOMATION__ADMIN_TOKEN: ${CHK_SVC_UI_AUTOMATION__ADMIN_TOKEN:?관리자 토큰을 .env에 넣으세요}
      CHK_SVC_UI_AUTOMATION__PORT: "8000"
      CHK_SVC_UI_AUTOMATION__CONSOLE_URL: http://localhost:${CHK_SVC_CONSOLE__HOST_PORT:-8001}
      # 모델 (치유·목표로 계획이 쓴다, C11 §모델 연결). 비우면 그 작업만 503 llm_unavailable이다.
      CHK_SVC_UI_AUTOMATION__LLM__BASE_URL: ${CHK_SVC_UI_AUTOMATION__LLM__BASE_URL:-}
      CHK_SVC_UI_AUTOMATION__LLM__MODEL: ${CHK_SVC_UI_AUTOMATION__LLM__MODEL:-}
      CHK_SVC_UI_AUTOMATION__LLM__API_KEY: ${CHK_SVC_UI_AUTOMATION__LLM__API_KEY:-}
    ports:
      - "${CHK_SVC_UI_AUTOMATION__HOST_PORT:-8000}:8000"
    volumes:
      - svc-uia-data:/data
    restart: unless-stopped

  svc-console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
      args:
        APP: svc-console
    environment:
      # 콘솔은 **컨테이너 이름**으로 앱을 부른다 (브라우저가 아니라 콘솔 서버가 부른다, ADR-0017 §1).
      CHK_SVC_CONSOLE__APP_URL: http://svc-uia:8000
      CHK_SVC_CONSOLE__SESSION_SECRET: ${CHK_SVC_CONSOLE__SESSION_SECRET:?세션 비밀을 .env에 넣으세요 (16자 이상)}
      PORT: "8001"
    ports:
      - "${CHK_SVC_CONSOLE__HOST_PORT:-8001}:8001"
    depends_on:
      - svc-uia
    restart: unless-stopped

volumes:
  center-data:
  svc-uia-data:
