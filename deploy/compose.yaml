# 서버 구성 한 번에 — Center·콘솔·서버 실행기. `docs/04-setup.md` §6의 포트를 그대로 쓴다.
#
#   cd deploy
#   cp .env.example .env     # 토큰을 채운다 (비밀은 저장소에 넣지 않는다)
#   docker compose up -d
#
# 서비스 앱과 그 관리 콘솔(`svc-console`, 서비스 앱마다 하나)은 여기 없다 — 띄울 서비스 앱이
# 생기면 그 앱과 함께 더한다 (ADR-0114).
name: chaeksas

services:
  center:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.center
    environment:
      # 비밀은 `.env`에서 온다 (compose 파일에 적지 않는다).
      # 첫 관리자 계정 — **계정이 하나도 없을 때만** 쓴다 (ADR-0090). 비밀번호를 비우면 Center가
      # 만들어 로그와 볼륨의 `first-admin-password.txt`에 둔다.
      CHK_CENTER__FIRST_ADMIN__USERNAME: ${CHK_CENTER__FIRST_ADMIN__USERNAME:-}
      CHK_CENTER__FIRST_ADMIN__PASSWORD: ${CHK_CENTER__FIRST_ADMIN__PASSWORD:-}
      # 자동화(스크립트)용 토큰 — 비우면 그 길이 닫힌다. 콘솔은 계정으로 들어온다.
      CHK_CENTER__ADMIN_TOKEN: ${CHK_CENTER__ADMIN_TOKEN:-}
      CHK_CENTER__READ_TOKEN: ${CHK_CENTER__READ_TOKEN:-}
      CHK_CENTER__PORT: "8800"
    ports:
      # 컨테이너 안의 포트는 문서의 기본값 그대로 두고, **호스트 쪽만** 바꿀 수 있게 한다
      # (한 PC에서 프로토타입과 같이 띄우면 겹친다 — `docs/04-setup.md` §6의 주의).
      - "${CHK_CENTER__HOST_PORT:-8800}:8800"
    volumes:
      - center-data:/data
    restart: unless-stopped

  server-runner:
    # 실행 위치 「서버」 BPM 프로세스를 돌린다 (C12). **들어오는 포트가 없다** — Center로 하트비트만 보낸다.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server-runner
    environment:
      # 컨테이너 이름으로 Center를 부른다 (콘솔과 같은 까닭 — 이 주소는 PC에서 닿지 않는다).
      CHK_SERVER_RUNNER__CENTER_URL: http://center:8800
      # 콘솔 「서버 실행」에 보일 이름. 비우면 컨테이너 호스트 이름(무작위 글자)이 된다.
      CHK_SERVER_RUNNER__NAME: ${CHK_SERVER_RUNNER__NAME:-server-runner}
      # Center API 키는 **등록 승인으로 받는다** — 처음 뜨면 요청 코드를 로그에 찍는다
      # (`docker compose logs server-runner`). 콘솔 「서버 실행」 → 「승인 대기」에서 같은 코드를 승인한다.
      # 받은 키·서비스 앱 키는 볼륨 `server-runner-secrets`에 간다 (ADR-0100 — 이미지가 정해 둔 자리).
      # 아래 값을 채우면 그 키가 이기고 등록 요청·회전·서비스 앱 키 받기를 하지 않는다 (CI·자동화용).
      CHK_SERVER_RUNNER__CENTER_API_KEY: ${CHK_SERVER_RUNNER__CENTER_API_KEY:-}
      CHK_SERVER_RUNNER__MAX_CONCURRENCY: ${CHK_SERVER_RUNNER__MAX_CONCURRENCY:-}
      # 모델 (AI 태스크, ADR-0027). 주소를 비우면 AI 태스크가 실패한다 — 조용히 넘어가지 않는다.
      # 호스트에서 도는 모델은 `http://host.docker.internal:<포트>/v1`로 가리킨다 (아래 `extra_hosts`).
      CHK_SERVER_RUNNER__LLM__BASE_URL: ${CHK_SERVER_RUNNER__LLM__BASE_URL:-}
      CHK_SERVER_RUNNER__LLM__MODEL: ${CHK_SERVER_RUNNER__LLM__MODEL:-}
      CHK_SERVER_RUNNER__LLM__API_KEY: ${CHK_SERVER_RUNNER__LLM__API_KEY:-}
      # 메일·웹훅 (ADR-0059). 비우면 보내지 않고 실패한다. 웹훅 허용 호스트는 쉼표로 여럿.
      CHK_SERVER_RUNNER__SMTP__HOST: ${CHK_SERVER_RUNNER__SMTP__HOST:-}
      CHK_SERVER_RUNNER__SMTP__PORT: ${CHK_SERVER_RUNNER__SMTP__PORT:-}
      CHK_SERVER_RUNNER__SMTP__SECURITY: ${CHK_SERVER_RUNNER__SMTP__SECURITY:-}
      CHK_SERVER_RUNNER__SMTP__USERNAME: ${CHK_SERVER_RUNNER__SMTP__USERNAME:-}
      CHK_SERVER_RUNNER__SMTP__FROM: ${CHK_SERVER_RUNNER__SMTP__FROM:-}
      CHK_SERVER_RUNNER__SMTP__PASSWORD: ${CHK_SERVER_RUNNER__SMTP__PASSWORD:-}
      CHK_SERVER_RUNNER__WEBHOOK__ALLOWED_HOSTS: ${CHK_SERVER_RUNNER__WEBHOOK__ALLOWED_HOSTS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 기다리는 실행(`state.sqlite3`)이 여기 있어 **다시 띄워도 결재 대기 중인 실행이 이어 간다** (ADR-0054).
      - server-runner-data:/data
      - server-runner-secrets:/secrets
    depends_on:
      center:
        condition: service_healthy
    # SIGTERM에 곱게 끝낸다 — 도는 실행을 담을 틈을 준다 (C12).
    stop_grace_period: 30s
    restart: unless-stopped

  center-console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
      args:
        APP: center-console
    environment:
      # 콘솔은 **컨테이너 이름**으로 Center를 부른다 (브라우저가 아니라 콘솔 서버가 부르기 때문에
      # localhost가 아니다, ADR-0017 §1).
      CHK_CONSOLE__CENTER_URL: http://center:8800
      # 위 막대에 보일 주소 — 사람이 PC 실행기·Studio에 적는 **바깥** 주소다 (위의 것은 PC에서 닿지 않는다).
      CHK_CONSOLE__CENTER_PUBLIC_URL: ${CHK_CONSOLE__CENTER_PUBLIC_URL:-http://localhost:8800}
      CHK_CONSOLE__SESSION_SECRET: ${CHK_CONSOLE__SESSION_SECRET:?세션 비밀을 .env에 넣으세요 (16자 이상)}
      PORT: "8501"
      # Next.js standalone은 `HOSTNAME`에 바인드하는데 Docker가 그것을 컨테이너 id로 채운다 —
      # 그러면 127.0.0.1을 두드리는 HEALTHCHECK가 닿지 못해 늘 unhealthy다.
      HOSTNAME: "0.0.0.0"
    ports:
      - "${CHK_CONSOLE__HOST_PORT:-8501}:8501"
    depends_on:
      - center
    restart: unless-stopped

volumes:
  center-data:
  server-runner-data:
  server-runner-secrets:
