# 서버 구성 한 번에 — Center·콘솔·서버 실행기. `docs/04-setup.md` §6의 포트를 그대로 쓴다.
#
#   cd deploy
#   cp .env.example .env     # 토큰을 채운다 (비밀은 저장소에 넣지 않는다)
#   docker compose up -d
#
# 서비스 앱과 그 관리 콘솔(`svc-console`, 서비스 앱마다 하나)은 여기 없다 — 띄울 서비스 앱이
# 생기면 그 앱과 함께 더한다 (ADR-0114).
name: chaeksas

services:
  center:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.center
    environment:
      # 비밀은 `.env`에서 온다 (compose 파일에 적지 않는다).
      # 첫 관리자 계정 — **계정이 하나도 없을 때만** 쓴다 (ADR-0090). 비밀번호를 비우면 Center가
      # 만들어 로그와 볼륨의 `first-admin-password.txt`에 둔다.
      BPM_CENTER__FIRST_ADMIN__USERNAME: ${BPM_CENTER__FIRST_ADMIN__USERNAME:-}
      BPM_CENTER__FIRST_ADMIN__PASSWORD: ${BPM_CENTER__FIRST_ADMIN__PASSWORD:-}
      # 자동화(스크립트)용 토큰 — 비우면 그 길이 닫힌다. 콘솔은 계정으로 들어온다.
      BPM_CENTER__ADMIN_TOKEN: ${BPM_CENTER__ADMIN_TOKEN:-}
      BPM_CENTER__READ_TOKEN: ${BPM_CENTER__READ_TOKEN:-}
      # 같이 뜨는 서버 실행기를 승인 없이 들이는 비밀 (ADR-0117) — 아래 실행기와 **같은 값**이다.
      BPM_CENTER__SERVER_RUNNER_JOIN_TOKEN: ${BPM_SERVER_RUNNER__JOIN_TOKEN:?들이기 비밀을 .env에 넣으세요 (BPM_SERVER_RUNNER__JOIN_TOKEN)}
      BPM_CENTER__PORT: "8800"
      # 일정의 벽시계 (ADR-0110). 콘솔도 **같은 값**으로 시각을 보인다 (아래 `TZ`).
      BPM_CENTER__TIMEZONE: ${BPM_CENTER__TIMEZONE:-Asia/Seoul}
      # 일꾼 폴더 (ADR-0122) — 일꾼은 여기 놓인 `<이름>.consumer.json`(토큰 해시)으로만 들어온다. 함께 배포되는
      # 프로그램이 제 파일을 아래 볼륨에 복사해 두면 Center가 **뜰 때** 들인다. 바꾸거나 빼면 Center를 다시 띄운다.
      # 같은 자리의 `<이름>.key.json`은 연동용·대리 답용 키다 (ADR-0123).
      BPM_CENTER__CONSUMERS_DIR: /consumers
    ports:
      # 컨테이너 안의 포트는 문서의 기본값 그대로 두고, **호스트 쪽만** 바꿀 수 있게 한다
      # (한 PC에서 프로토타입과 같이 띄우면 겹친다 — `docs/04-setup.md` §6의 주의).
      - "${BPM_CENTER__HOST_PORT:-8800}:8800"
    volumes:
      - center-data:/data
      # 읽기만 한다. **폴더가 원본이다** — 파일을 빼고 다시 띄우면 일꾼 키가 폐기되고 그 일꾼만 맡던 확장은 철회된다.
      - ${BPM_CENTER__CONSUMERS_HOST_DIR:-./consumers}:/consumers:ro
    restart: unless-stopped

  server-runner:
    # 실행 위치 「서버」 BPM 프로세스를 돌린다 (C12). **들어오는 포트가 없다** — Center로 하트비트만 보낸다.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server-runner
    environment:
      # 컨테이너 이름으로 Center를 부른다 (콘솔과 같은 까닭 — 이 주소는 PC에서 닿지 않는다).
      BPM_SERVER_RUNNER__CENTER_URL: http://center:8800
      # 콘솔 「서버 실행」에 보일 이름. 비우면 컨테이너 호스트 이름(무작위 글자)이 된다.
      BPM_SERVER_RUNNER__NAME: ${BPM_SERVER_RUNNER__NAME:-server-runner}
      # Center API 키는 **들이기 비밀로 바로 받는다** (ADR-0117) — Center와 같은 값을 등록 요청에 싣고,
      # 맞으면 Center가 그 자리에서 승인한다. 사람이 승인하지 않는다.
      # 받은 키는 볼륨 `server-runner-secrets`에 간다 (ADR-0100 — 이미지가 정해 둔 자리).
      BPM_SERVER_RUNNER__JOIN_TOKEN: ${BPM_SERVER_RUNNER__JOIN_TOKEN:?들이기 비밀을 .env에 넣으세요 (BPM_SERVER_RUNNER__JOIN_TOKEN)}
      # 아래 값을 채우면 그 키가 이기고 등록 요청·회전·서비스 앱 키 받기를 하지 않는다 (CI·자동화용).
      BPM_SERVER_RUNNER__CENTER_API_KEY: ${BPM_SERVER_RUNNER__CENTER_API_KEY:-}
      BPM_SERVER_RUNNER__MAX_CONCURRENCY: ${BPM_SERVER_RUNNER__MAX_CONCURRENCY:-}
      # 모델 (AI 태스크, ADR-0027). 주소를 비우면 AI 태스크가 실패한다 — 조용히 넘어가지 않는다.
      # 호스트에서 도는 모델은 `http://host.docker.internal:<포트>/v1`로 가리킨다 (아래 `extra_hosts`).
      BPM_SERVER_RUNNER__LLM__BASE_URL: ${BPM_SERVER_RUNNER__LLM__BASE_URL:-}
      BPM_SERVER_RUNNER__LLM__MODEL: ${BPM_SERVER_RUNNER__LLM__MODEL:-}
      BPM_SERVER_RUNNER__LLM__API_KEY: ${BPM_SERVER_RUNNER__LLM__API_KEY:-}
      # 메일·웹훅 (ADR-0059). 비우면 보내지 않고 실패한다. 웹훅 허용 호스트는 쉼표로 여럿.
      BPM_SERVER_RUNNER__SMTP__HOST: ${BPM_SERVER_RUNNER__SMTP__HOST:-}
      BPM_SERVER_RUNNER__SMTP__PORT: ${BPM_SERVER_RUNNER__SMTP__PORT:-}
      BPM_SERVER_RUNNER__SMTP__SECURITY: ${BPM_SERVER_RUNNER__SMTP__SECURITY:-}
      BPM_SERVER_RUNNER__SMTP__USERNAME: ${BPM_SERVER_RUNNER__SMTP__USERNAME:-}
      BPM_SERVER_RUNNER__SMTP__FROM: ${BPM_SERVER_RUNNER__SMTP__FROM:-}
      BPM_SERVER_RUNNER__SMTP__PASSWORD: ${BPM_SERVER_RUNNER__SMTP__PASSWORD:-}
      BPM_SERVER_RUNNER__WEBHOOK__ALLOWED_HOSTS: ${BPM_SERVER_RUNNER__WEBHOOK__ALLOWED_HOSTS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 기다리는 실행(`state.sqlite3`)이 여기 있어 **다시 띄워도 결재 대기 중인 실행이 이어 간다** (ADR-0054).
      - server-runner-data:/data
      - server-runner-secrets:/secrets
    depends_on:
      center:
        condition: service_healthy
    # SIGTERM에 곱게 끝낸다 — 도는 실행을 담을 틈을 준다 (C12).
    stop_grace_period: 30s
    restart: unless-stopped

  center-console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
      args:
        APP: center-console
    environment:
      # 콘솔은 **컨테이너 이름**으로 Center를 부른다 (브라우저가 아니라 콘솔 서버가 부르기 때문에
      # localhost가 아니다, ADR-0017 §1).
      BPM_CONSOLE__CENTER_URL: http://center:8800
      # 위 막대에 보일 주소 — 사람이 PC 실행기·Studio에 적는 **바깥** 주소다 (위의 것은 PC에서 닿지 않는다).
      BPM_CONSOLE__CENTER_PUBLIC_URL: ${BPM_CONSOLE__CENTER_PUBLIC_URL:-http://localhost:8800}
      BPM_CONSOLE__SESSION_SECRET: ${BPM_CONSOLE__SESSION_SECRET:?세션 비밀을 .env에 넣으세요 (16자 이상)}
      PORT: "8501"
      # 콘솔은 시각을 **서버에서** 글로 만든다 — 컨테이너 기본(UTC)이면 한국에서 9시간 이르게 보인다.
      # Center의 일정 시간대와 같은 값을 쓴다.
      TZ: ${BPM_CENTER__TIMEZONE:-Asia/Seoul}
      # Next.js standalone은 `HOSTNAME`에 바인드하는데 Docker가 그것을 컨테이너 id로 채운다 —
      # 그러면 127.0.0.1을 두드리는 HEALTHCHECK가 닿지 못해 늘 unhealthy다.
      HOSTNAME: "0.0.0.0"
    ports:
      - "${BPM_CONSOLE__HOST_PORT:-8501}:8501"
    depends_on:
      - center
    restart: unless-stopped

volumes:
  center-data:
  server-runner-data:
  server-runner-secrets:
