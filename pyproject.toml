# uv 워크스페이스 루트 — 이 파일 자체는 패키지가 아니다 (docs/01-architecture.md §8).
# 멤버는 packages/*, apps/*, extensions/* 각각의 pyproject.toml에 있다.

[tool.uv.workspace]
members = ["packages/*", "apps/*", "extensions/*"]
# spikes/는 멤버가 아니다 — 제품 코드가 import하지 않는다 (CLAUDE.md §3).
# web/은 pnpm 워크스페이스다 (ADR-0017).

[tool.uv]
# ADR-0005: 인터프리터는 uv가 관리한다. 시스템 Python은 후보에서 뺀다.
python-preference = "only-managed"
python-downloads = "automatic"

[dependency-groups]
dev = [
    "httpx>=0.27", # fastapi TestClient
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# __pyinstaller/: PyInstaller 분석 과정이 읽는 훅. 평범한 모듈이 아니다 (파일 이름에 점, 전역
# 변수로 결과를 돌려준다). 설치 파일을 만들 때만 쓰이므로 검사에서 뺀다 (ADR-0024).
extend-exclude = ["spikes", "docs/08-business-examples/_source", "**/__pyinstaller"]

[tool.ruff.lint]
# PLW1514: 텍스트 파일을 열 때 encoding을 적지 않은 곳 (CLAUDE.md §5 — Windows 기본 인코딩은
# cp949다). 아직 미리보기 규칙이라, 다른 미리보기 규칙이 함께 켜지지 않게 explicit로 제한한다.
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "UP", "B", "PTH", "PLW1514"]

[tool.ruff.lint.isort]
known-first-party = ["chaeksas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
strict = true
# 뼈대 단계: 외부 라이브러리 타입이 없는 것은 아직 막지 않는다.
ignore_missing_imports = true
# 멤버마다 src 레이아웃이라 각 src가 모듈 경로의 뿌리다 (chaeksas.* 네임스페이스, ADR-0019).
# 뿌리를 알려 주지 않으면 같은 파일이 packages.contracts.src.chaeksas.contracts로도 보여 충돌한다.
mypy_path = [
    "packages/contracts/src",
    "packages/extension_api/src",
    "packages/core/src",
    "packages/qt/src",
    "packages/service_kit/src",
    "apps/studio/src",
    "apps/bot_ui/src",
    "apps/server_runner/src",
    "apps/admin/src",
    "apps/center/src",
    "extensions/ui_automation/src",
]
files = ["tests", "scripts", "packages/*/src", "apps/*/src", "extensions/*/src"]
# PyInstaller 훅은 모듈 이름 규칙 밖이다 (위 ruff 설명과 같은 이유).
exclude = ["/__pyinstaller/"]
