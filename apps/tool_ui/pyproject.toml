[project]
name = "chaeksas-tool-ui"
version = "0.1.0"
description = "Tool UI — 확장이 기여한 도구를 띄우는 창 (ADR-0077). 로컬 런타임은 Bot UI가 띄운 것을 빌린다"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chaeksas-contracts",
    "chaeksas-core",
    "chaeksas-qt",
    "httpx>=0.27",        # 런타임 health 묻기 (127.0.0.1)
    "keyring>=25.4",      # OS 비밀 저장소 — 도구의 비밀 칸 (CLAUDE.md §5)
    "platformdirs>=4.3",  # 사용자 데이터 위치
]

[project.scripts]
chk-tool-ui = "chaeksas.tool_ui.app:main"

[tool.uv.sources]
chaeksas-contracts = { workspace = true }
chaeksas-core = { workspace = true }
chaeksas-qt = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# chaeksas는 PEP 420 네임스페이스 — src/chaeksas 밑에 __init__.py를 두지 않는다
packages = ["src/chaeksas"]
