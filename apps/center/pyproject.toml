[project]
name = "chaeksas-center"
version = "0.1.0"
description = "Center API — 패키지 레지스트리, 배포, 작업, 결재 창구, 실행 이력, Center API 키"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chaeksas-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "platformdirs>=4.3",
    "python-multipart>=0.0.12", # 패키지 업로드 (multipart/form-data)
]

[tool.uv.sources]
chaeksas-contracts = { workspace = true }

[project.scripts]
chk-center = "chaeksas.center.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# chaeksas는 PEP 420 네임스페이스 — src/chaeksas 밑에 __init__.py를 두지 않는다
packages = ["src/chaeksas"]
