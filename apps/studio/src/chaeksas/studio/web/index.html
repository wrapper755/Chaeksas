<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Chaeksas Studio 캔버스</title>
  <!--
    오프라인이다 (ADR-0022·ADR-0029) — 모든 자원이 로컬 파일이고 CDN을 쓰지 않는다.
    `vendor/`는 생성물이다 (`pnpm --filter @chaeksas/bpmn-canvas build`). 이 파일은 우리가 쓴다.
  -->
  <link rel="stylesheet" href="vendor/assets/diagram-js.css">
  <link rel="stylesheet" href="vendor/assets/bpmn-js.css">
  <link rel="stylesheet" href="vendor/assets/bpmn-font/css/bpmn-embedded.css">
  <style>
    /* 색은 Python 쪽이 토큰에서 넣어 준다 (`--chk-*`) — 여기 값을 적지 않는다 (ADR-0017). */
    html, body { margin: 0; height: 100%; background: var(--chk-bg, #ffffff); }
    #canvas { height: 100%; }
    .djs-palette { background: var(--chk-surface, #ffffff); }
  </style>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="vendor/bpmn-modeler.production.min.js"></script>
  <script src="chk-moddle.js"></script>
</head>
<body>
<div id="canvas"></div>
<script>
  // Python ↔ JS는 QWebChannel 하나다 (ADR-0022).
  //   Python → JS : window.chk(요청 id, 함수 이름, 인자 JSON)
  //   JS → Python : bridge.result(요청 id, 결과 JSON) / bridge.changed(dirty) / bridge.picked(id)
  // `runJavaScript`가 Promise 결과를 못 받아서 요청 id로 짝을 맞춘다.
  // moddle 타입 이름은 대문자로 시작하고(`chk:AiTask`), XML 태그는 `tagAlias: lowerCase`가
  // 되돌린다(`chk:aiTask`). C14 모델의 이름은 뒤쪽이므로 경계에서 바꿔 준다.
  const toName = (type) => { const n = String(type).slice(4); return n[0].toLowerCase() + n.slice(1); };
  const toType = (name) => `chk:${name[0].toUpperCase()}${name.slice(1)}`;

  /**
   * `chk:*` 하나의 속성 — `chk:task`만 `type`·`extension`이 XML 속성이고 나머지는 본문뿐이다
   * (C14). 만들 때(`createTask`)와 고칠 때(`setProperties`)가 **같은 함수**를 써야 한쪽만
   * 고쳐져 종류가 날아가는 일이 없다.
   */
  const chkAttrs = (name, text) => {
    if (name !== "task") return { value: String(text) };
    let whole = {};
    try { whole = JSON.parse(String(text)); } catch (e) { whole = {}; }
    return {
      type: String(whole.type || ""),
      extension: String(whole.extension || ""),
      value: JSON.stringify(whole.data || {}, null, 2),
    };
  };

  /**
   * 새 노드를 놓을 자리 — 보이는 자리의 가운데에서 시작해 **겹치지 않을 때까지** 비낀다.
   * 여러 개를 잇달아 더해도 한 점에 쌓이지 않는다.
   */
  const freeSpot = (canvas, registry, shape) => {
    const box = canvas.viewbox();
    let x = Math.round(box.x + box.width / 2);
    let y = Math.round(box.y + box.height / 2);
    const taken = (px, py) => registry.getAll().some((e) => (
      e.parent && e.width && e.height
      && e.x < px + shape.width / 2 && px - shape.width / 2 < e.x + e.width
      && e.y < py + shape.height / 2 && py - shape.height / 2 < e.y + e.height
    ));
    for (let i = 0; i < 40 && taken(x, y); i += 1) { x += 40; y += 40; }
    return { x, y };
  };

  async function boot() {
    const modeler = new BpmnJS({
      container: "#canvas",
      // `chk:*`를 타입으로 다룬다 — 설명은 C14 모델에서 생성한다 (scripts/gen_moddle.py).
      moddleExtensions: { chk: window.CHK_MODDLE },
    });
    let bridge = null;
    let dirty = false;

    modeler.on("commandStack.changed", () => {
      dirty = true;
      if (bridge) bridge.changed(true);
    });
    modeler.on("selection.changed", (e) => {
      const one = (e.newSelection || []).length === 1 ? e.newSelection[0] : null;
      if (bridge) bridge.picked(one ? one.id : "");
    });

    const api = {
      async importXML(xml) {
        const found = await modeler.importXML(xml);
        modeler.get("canvas").zoom("fit-viewport");
        dirty = false;
        return { warnings: (found.warnings || []).map((w) => String(w.message || w)) };
      },
      async saveXML() {
        const { xml } = await modeler.saveXML({ format: true });
        dirty = false;
        return { xml };
      },
      async createEmpty(processId, name) {
        await modeler.createDiagram();
        const registry = modeler.get("elementRegistry");
        const process = registry.find((e) => e.type === "bpmn:Process");
        if (process) {
          modeler.get("modeling").updateProperties(process, { id: processId, name });
        }
        dirty = false;
        return { ok: true };
      },
      async undo() { modeler.get("commandStack").undo(); return { ok: true }; },
      async redo() { modeler.get("commandStack").redo(); return { ok: true }; },
      /** STU-04가 읽는 것 — 이름·설명·조건식·스크립트와 `chk:*` 본문(JSON 글 그대로). */
      async properties(id) {
        const element = modeler.get("elementRegistry").get(id);
        if (!element) return { found: false };
        const bo = element.businessObject;
        const chk = {};
        for (const one of (bo.extensionElements && bo.extensionElements.values) || []) {
          if (!String(one.$type).startsWith("chk:")) continue;
          const name = toName(one.$type);
          if (name === "task") {
            // `chk:task`만 `type`·`extension`이 XML 속성이다 (C14) — 본문과 함께 싣는다.
            let data = {};
            try { data = JSON.parse(one.value || "{}"); } catch (e) { data = one.value || {}; }
            chk[name] = JSON.stringify(
              { type: one.type || "", extension: one.extension || "", data },
              null, 2,
            );
          } else {
            chk[name] = one.value || "";
          }
        }
        return {
          found: true,
          id: bo.id,
          type: String(bo.$type || "").replace("bpmn:", ""),
          name: bo.name || "",
          documentation: (bo.documentation || []).map((d) => d.text || "").join("\n"),
          condition: (bo.conditionExpression && bo.conditionExpression.body) || "",
          script: bo.script || "",
          chk,
        };
      },
      /**
       * STU-04의 「적용」. **bpmn-js의 modeling으로 고친다** — 그래야 실행 취소와
       * 「저장 안 한 변경」이 함께 움직인다 (XML을 우리가 직접 만지면 둘 다 깨진다).
       */
      async setProperties(id, patch) {
        const element = modeler.get("elementRegistry").get(id);
        if (!element) return { found: false };
        const modeling = modeler.get("modeling");
        const moddle = modeler.get("moddle");
        const bo = element.businessObject;

        // 표준 속성은 **한 번에** 바꾼다 — 실행 취소가 한 걸음이 되게.
        const plain = {};
        if ("name" in patch) plain.name = patch.name;
        if ("documentation" in patch) {
          const text = String(patch.documentation || "");
          plain.documentation = text ? [moddle.create("bpmn:Documentation", { text })] : [];
        }
        if ("condition" in patch) {
          const body = String(patch.condition || "");
          plain.conditionExpression = body ? moddle.create("bpmn:FormalExpression", { body }) : undefined;
        }
        if ("script" in patch) plain.script = String(patch.script || "");
        if (Object.keys(plain).length) modeling.updateProperties(element, plain);

        if (patch.chk) {
          let holder = bo.extensionElements;
          if (!holder) {
            holder = moddle.create("bpmn:ExtensionElements", { values: [] });
            modeling.updateProperties(element, { extensionElements: holder });
          }
          for (const [name, text] of Object.entries(patch.chk)) {
            const type = toType(name);
            const found = (holder.values || []).find((v) => String(v.$type) === type);
            if (text === null) {
              if (found) {
                modeling.updateModdleProperties(element, holder, {
                  values: holder.values.filter((v) => v !== found),
                });
              }
              continue;
            }
            // `chk:task`는 속성과 본문으로 갈라 쓴다 (C14).
            const attrs = chkAttrs(name, text);
            if (found) {
              modeling.updateModdleProperties(element, found, attrs);
            } else {
              const made = moddle.create(type, attrs);
              modeling.updateModdleProperties(element, holder, {
                values: [...(holder.values || []), made],
              });
            }
          }
        }
        return { found: true };
      },
      /**
       * STU-03 「캔버스에 추가」 — 리소스 탐색기가 고른 것으로 노드 하나를 만든다.
       *
       * **`chk:*`를 businessObject에 미리 달고 한 번에 만든다** — 만든 뒤에 고치면
       * 실행 취소가 두 걸음이 된다 (`setProperties`가 지키는 규칙과 같다).
       */
      async createTask(spec) {
        const bpmnFactory = modeler.get("bpmnFactory");
        const type = String((spec && spec.bpmn) || "bpmn:ServiceTask");
        const bo = bpmnFactory.create(type, { name: String((spec && spec.name) || "") });
        const entries = Object.entries((spec && spec.chk) || {});
        if (entries.length) {
          const values = entries.map(([name, text]) => bpmnFactory.create(toType(name), chkAttrs(name, text)));
          const holder = bpmnFactory.create("bpmn:ExtensionElements", { values });
          for (const one of values) one.$parent = holder;
          holder.$parent = bo;
          bo.extensionElements = holder;
        }
        const canvas = modeler.get("canvas");
        const shape = modeler.get("elementFactory").createShape({ type, businessObject: bo });
        const at = freeSpot(canvas, modeler.get("elementRegistry"), shape);
        const made = modeler.get("modeling").createShape(shape, at, canvas.getRootElement());
        modeler.get("selection").select(made);
        return { id: made.id };
      },
      async select(id) {
        const found = modeler.get("elementRegistry").get(id);
        if (found) modeler.get("selection").select(found);
        return { ok: Boolean(found) };
      },
      async stats() {
        return { elements: modeler.get("elementRegistry").getAll().length, dirty };
      },
      /** 노드에 상태 색을 입힌다 (실행 표시, STU-09). `states`는 {노드 id: 상태}. */
      async mark(states) {
        const canvas = modeler.get("canvas");
        for (const element of modeler.get("elementRegistry").getAll()) {
          for (const name of ["chk-running", "chk-done", "chk-failed", "chk-waiting"]) {
            canvas.removeMarker(element.id, name);
          }
        }
        for (const [id, state] of Object.entries(states || {})) {
          if (modeler.get("elementRegistry").get(id)) canvas.addMarker(id, `chk-${state}`);
        }
        return { ok: true };
      },
    };

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.bridge;
      window.chk = (requestId, name, argsJson) => {
        const run = api[name];
        if (!run) {
          bridge.result(requestId, JSON.stringify({ ok: false, error: `모르는 함수다: ${name}` }));
          return;
        }
        run(...JSON.parse(argsJson))
          .then((found) => bridge.result(requestId, JSON.stringify({ ok: true, ...found })))
          .catch((e) => bridge.result(requestId, JSON.stringify({ ok: false, error: String((e && e.message) || e) })));
      };
      bridge.ready();
    });
  }
  boot();
</script>
</body>
</html>
