<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Chaeksas Studio 캔버스</title>
  <!--
    오프라인이다 (ADR-0022·ADR-0029) — 모든 자원이 로컬 파일이고 CDN을 쓰지 않는다.
    `vendor/`는 생성물이다 (`pnpm --filter @chaeksas/bpmn-canvas build`). 이 파일은 우리가 쓴다.
  -->
  <link rel="stylesheet" href="vendor/assets/diagram-js.css">
  <link rel="stylesheet" href="vendor/assets/bpmn-js.css">
  <link rel="stylesheet" href="vendor/assets/bpmn-font/css/bpmn-embedded.css">
  <style>
    /* 그림도 창의 테마를 따른다 (ADR-0101) — `--chk-*`는 캔버스(canvas.py)가 토큰에서 넣는다.
       넣기 전(페이지가 막 뜬 때)에는 bpmn-js 기본값이 쓰인다. */
    html, body { margin: 0; height: 100%; background: var(--chk-surface, white); }
    #canvas { height: 100%; }
    /* 포커스 테두리는 Chromium 기본(리눅스에서는 주황)이 캔버스 둘레에 뜬다 — 카드 테두리가 영역을 말한다. */
    .djs-container svg:focus { outline: none; }
    /* 팔레트·문맥 메뉴·선택 윤곽은 bpmn-js의 `--bio-*`를 쓴다 — 테마가 들어온 뒤에만 덮는다. */
    html[data-chk-theme] .bio-theme-parent {
      --bio-surface: var(--chk-surface);
      --bio-surface-overlay: var(--chk-surface);
      --bio-surface-subtle: var(--chk-subtle);
      --bio-surface-medium: var(--chk-subtle);
      --bio-text: var(--chk-text);
      --bio-text-subtle: var(--chk-text-muted);
      --bio-text-subtlest: var(--chk-text-muted);
      --bio-border: var(--chk-border-strong);
      --bio-border-disabled: var(--chk-border);
      --bio-primary: var(--chk-accent);
      --bio-primary-surface: var(--chk-accent-subtle);
      --bio-selected-surface: var(--chk-accent-subtle);
      --bio-focus: var(--chk-accent);
      --bio-focus-surface: var(--chk-accent-subtle);
      --bio-canvas-accent: var(--chk-accent);
    }
  </style>
  <script>
    /** 캔버스(canvas.py)가 테마 색을 넣는 자리 (ADR-0101) — `{CSS 변수: 색}`. 다리보다 먼저 있어야 한다. */
    window.chkTheme = (vars) => {
      const root = document.documentElement;
      for (const [name, value] of Object.entries(vars || {})) root.style.setProperty(name, String(value));
      root.dataset.chkTheme = "1";
    };
  </script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="vendor/bpmn-modeler.production.min.js"></script>
  <script src="chk-moddle.js"></script>
  <script src="vendor/bpmn-auto-layout.min.js"></script>
</head>
<body>
<div id="canvas"></div>
<script>
  // Python ↔ JS는 QWebChannel 하나다 (ADR-0022).
  //   Python → JS : window.chk(요청 id, 함수 이름, 인자 JSON)
  //   JS → Python : bridge.result(요청 id, 결과 JSON) / bridge.changed(dirty) / bridge.picked(id)
  // `runJavaScript`가 Promise 결과를 못 받아서 요청 id로 짝을 맞춘다.
  // moddle 타입 이름은 대문자로 시작하고(`chk:AiTask`), XML 태그는 `tagAlias: lowerCase`가
  // 되돌린다(`chk:aiTask`). C14 모델의 이름은 뒤쪽이므로 경계에서 바꿔 준다.
  const toName = (type) => { const n = String(type).slice(4); return n[0].toLowerCase() + n.slice(1); };
  const toType = (name) => `chk:${name[0].toUpperCase()}${name.slice(1)}`;
  /** 반복 표시 → `""`(없음·표준 loop) | `"sequential"` | `"parallel"` — 엔진(`is_sequential`)과 같은 읽기. */
  const multiInstanceOf = (bo) => {
    const found = bo.loopCharacteristics;
    if (!found || found.$type !== "bpmn:MultiInstanceLoopCharacteristics") return "";
    return found.isSequential ? "sequential" : "parallel";
  };

  /**
   * `chk:*` 하나의 속성 — `chk:task`만 `type`·`extension`이 XML 속성이고 나머지는 본문뿐이다
   * (C14). 만들 때(`createTask`)와 고칠 때(`setProperties`)가 **같은 함수**를 써야 한쪽만
   * 고쳐져 종류가 날아가는 일이 없다.
   */
  const chkAttrs = (name, text) => {
    if (name !== "task") return { value: String(text) };
    let whole = {};
    try { whole = JSON.parse(String(text)); } catch (e) { whole = {}; }
    return {
      type: String(whole.type || ""),
      extension: String(whole.extension || ""),
      value: JSON.stringify(whole.data || {}, null, 2),
    };
  };

  /** 왼쪽 팔레트가 가리는 너비 (그림을 그 옆에서 시작한다). */
  const PALETTE_GAP = 120;

  /**
   * 열 때의 자리 (STU-01 [C]) — **보통 크기(100%)**, 그림이 화면 가운데에 온다. 그림이 화면보다
   * 넓으면 가로는 시작 쪽(왼쪽, 팔레트 옆)을 맞춘다 — 가운데를 맞추면 시작 이벤트가 밖에 있다.
   */
  const centerAtNormalZoom = (canvas) => {
    canvas.zoom(1);
    const { inner, outer } = canvas.viewbox();
    const fits = inner.width + 2 * PALETTE_GAP <= outer.width;
    canvas.viewbox({
      x: fits ? inner.x + inner.width / 2 - outer.width / 2 : inner.x - PALETTE_GAP,
      y: inner.y + inner.height / 2 - outer.height / 2,
      width: outer.width,
      height: outer.height,
    });
  };

  /**
   * 새 노드를 놓을 자리 — 보이는 자리의 가운데에서 시작해 **겹치지 않을 때까지** 비낀다.
   * 여러 개를 잇달아 더해도 한 점에 쌓이지 않는다.
   */
  const freeSpot = (canvas, registry, shape) => {
    const box = canvas.viewbox();
    let x = Math.round(box.x + box.width / 2);
    let y = Math.round(box.y + box.height / 2);
    const taken = (px, py) => registry.getAll().some((e) => (
      e.parent && e.width && e.height
      && e.x < px + shape.width / 2 && px - shape.width / 2 < e.x + e.width
      && e.y < py + shape.height / 2 && py - shape.height / 2 < e.y + e.height
    ));
    for (let i = 0; i < 40 && taken(x, y); i += 1) { x += 40; y += 40; }
    return { x, y };
  };

  /**
   * 끌어다 놓은 **화면 자리**(캔버스 위젯의 CSS 픽셀)를 다이어그램 좌표로 바꾼다 (ADR-0044).
   * 축척·스크롤을 아는 쪽이 하나여야 하므로 **여기서** 바꾼다 (Qt는 그것을 모른다).
   * 놓은 점이 노드의 **가운데**가 된다 — 사람이 그렇게 기대한다.
   */
  const spotAt = (canvas, at) => {
    const box = canvas.viewbox();
    const rect = document.querySelector("#canvas").getBoundingClientRect();
    return {
      x: Math.round(box.x + (Number(at.x) - rect.left) / box.scale),
      y: Math.round(box.y + (Number(at.y) - rect.top) / box.scale),
    };
  };

  /**
   * 그림 좌표(DI)가 없으면 배치한 XML을 준다 (ADR-0088). **있으면 그대로** — 사람이 놓은 자리를
   * 덮지 않는다. 읽지 못하는 XML은 그대로 넘겨 bpmn-js가 제 말로 거부하게 한다.
   */
  async function laidOutXml(xml) {
    try {
      if (window.ChkAutoLayout && (await ChkAutoLayout.needsLayout(xml))) {
        return { xml: await ChkAutoLayout.layout(xml), laidOut: true };
      }
    } catch (e) {
      // 아래 importXML이 같은 까닭으로 실패하며 말한다.
    }
    return { xml, laidOut: false };
  }

  async function boot() {
    const modeler = new BpmnJS({
      container: "#canvas",
      // 그림의 선·채움·글자를 테마 변수로 그린다 (ADR-0101) — 테마를 바꿔도 다시 그리지 않는다.
      bpmnRenderer: {
        defaultFillColor: "var(--chk-surface, white)",
        defaultStrokeColor: "var(--chk-line, black)",
        defaultLabelColor: "var(--chk-text, black)",
      },
      // `chk:*`를 타입으로 다룬다 — 설명은 C14 모델에서 생성한다 (scripts/gen_moddle.py).
      moddleExtensions: { chk: window.CHK_MODDLE },
    });
    let bridge = null;
    let dirty = false;

    modeler.on("commandStack.changed", () => {
      dirty = true;
      if (bridge) bridge.changed(true);
    });
    modeler.on("selection.changed", (e) => {
      const one = (e.newSelection || []).length === 1 ? e.newSelection[0] : null;
      if (bridge) bridge.picked(one ? one.id : "");
    });

    /** 노드 하나의 businessObject — `chk:*`를 **만들 때 함께** 단다(만든 뒤 고치면 실행 취소가 늘어난다). */
    const makeBo = (spec) => {
      const bpmnFactory = modeler.get("bpmnFactory");
      const type = String((spec && spec.bpmn) || "bpmn:ServiceTask");
      // `attrs`는 **그냥 BPMN 속성**이다 (`calledElement` 같은 것, ADR-0051) — `chk:*`가
      // 아니라 요소 자신의 칸이라 만들 때 함께 넣는다. 글만 받는다.
      const attrs = {};
      for (const [name, value] of Object.entries((spec && spec.attrs) || {})) {
        if (typeof value === "string" && value) attrs[name] = value;
      }
      const bo = bpmnFactory.create(type, { name: String((spec && spec.name) || ""), ...attrs });
      const holder = extensionsOf(bpmnFactory, bo, (spec && spec.chk) || {});
      if (holder) bo.extensionElements = holder;
      return bo;
    };

    /** `{요소 이름: JSON 글}` → `bpmn:ExtensionElements` (비면 `null`). */
    const extensionsOf = (bpmnFactory, bo, chk) => {
      const entries = Object.entries(chk);
      if (!entries.length) return null;
      const values = entries.map(([name, text]) => bpmnFactory.create(toType(name), chkAttrs(name, text)));
      const holder = bpmnFactory.create("bpmn:ExtensionElements", { values });
      for (const one of values) one.$parent = holder;
      holder.$parent = bo;
      return holder;
    };

    // 위임 호출로 바꾸기 (ADR-0071) — 안쪽 명령들이 **하나의 실행 취소**로 묶인다.
    modeler.get("commandStack").registerHandler("chk.delegateNode", function DelegateNode() {
      this.preExecute = (context) => {
        const spec = context.spec;
        const made = modeler.get("bpmnReplace").replaceElement(context.element, { type: "bpmn:CallActivity" });
        const holder = extensionsOf(modeler.get("bpmnFactory"), made.businessObject, spec.chk || {});
        const patch = { name: String(spec.name || ""), extensionElements: holder || undefined };
        if (spec.calledElement) patch.calledElement = String(spec.calledElement);
        modeler.get("modeling").updateProperties(made, patch);
        context.made = made;
      };
    });

    /** 노드를 사람이 읽는 말로 — 이름, 없으면 id. */
    const labelOf = (bo) => String((bo && (bo.name || bo.id)) || "");

    /**
     * 게이트웨이가 보는 것 (STU-04 「게이트웨이」) — 기본 흐름과 들어오고 나가는 흐름.
     * 조건식은 **읽기만** 한다 — 고치는 자리는 그 흐름의 「폼」 탭 하나다.
     */
    const gatewayOf = (bo) => {
      if (!/Gateway$/.test(String(bo.$type || ""))) return null;
      return {
        default: (bo.default && bo.default.id) || "",
        incoming: (bo.incoming || []).map((f) => ({ id: f.id, from: labelOf(f.sourceRef) })),
        outgoing: (bo.outgoing || []).map((f) => ({
          id: f.id,
          name: f.name || "",
          to: labelOf(f.targetRef),
          condition: (f.conditionExpression && f.conditionExpression.body) || "",
        })),
      };
    };

    /** 첫 이벤트 정의 — 엔진처럼 하나만 본다. */
    const definitionOf = (bo) => ((bo.eventDefinitions || [])[0]) || null;
    const TIMER_KINDS = ["timeDate", "timeDuration", "timeCycle"];

    /**
     * 이벤트·받기 태스크가 보는 것 (STU-04 「이벤트」·「받기」). 이름은 **정의 수준 요소의 이름**이다
     * (`bpmn:message name` 등 — 엔진·매니페스트가 그것을 쓴다, C12).
     */
    const eventOf = (bo) => {
      const type = String(bo.$type || "");
      if (!/Event$/.test(type) && type !== "bpmn:ReceiveTask") return null;
      const found = definitionOf(bo);
      const out = {
        definition: found ? String(found.$type).replace("bpmn:", "").replace("EventDefinition", "") : "",
        attachedTo: bo.attachedToRef ? labelOf(bo.attachedToRef) : "",
        cancelActivity: bo.cancelActivity !== false,
        timer: null,
        message: "",
        signal: "",
        error: "",
      };
      if (type === "bpmn:ReceiveTask") {
        out.definition = "Message";
        out.message = (bo.messageRef && bo.messageRef.name) || "";
        return out;
      }
      if (!found) return out;
      if (found.$type === "bpmn:TimerEventDefinition") {
        const kind = TIMER_KINDS.find((k) => found[k]) || "";
        out.timer = { kind, value: kind ? String(found[kind].body || "") : "" };
      }
      if (found.messageRef) out.message = found.messageRef.name || "";
      if (found.signalRef) out.signal = found.signalRef.name || "";
      if (found.errorRef) out.error = found.errorRef.errorCode || "";
      return out;
    };

    /**
     * 그 이름의 정의 수준 요소(`bpmn:Message` 등) — **있으면 가리키고 없으면 만든다**. 다른 이벤트와
     * 함께 쓰던 요소의 이름을 바꾸면 그쪽까지 바뀌므로 이름을 고치지 않는다.
     */
    const rootNamed = (element, type, prefix, key, value, extra) => {
      const modeling = modeler.get("modeling");
      const moddle = modeler.get("moddle");
      const definitions = modeler.getDefinitions();
      const roots = definitions.rootElements || [];
      const found = roots.find((r) => r.$type === type && r[key] === value);
      if (found) return found;
      const id = moddle.ids ? moddle.ids.nextPrefixed(prefix) : `${prefix}${Math.random().toString(36).slice(2, 9)}`;
      const made = moddle.create(type, { id, ...extra });
      made.$parent = definitions;
      modeling.updateModdleProperties(element, definitions, { rootElements: [...roots, made] });
      return made;
    };

    /** `setProperties`의 `event` — 바뀐 칸만 온다. */
    const setEvent = (element, patch) => {
      const modeling = modeler.get("modeling");
      const moddle = modeler.get("moddle");
      const bo = element.businessObject;
      const found = definitionOf(bo);
      if ("cancelActivity" in patch && bo.$type === "bpmn:BoundaryEvent") {
        modeling.updateProperties(element, { cancelActivity: Boolean(patch.cancelActivity) });
      }
      if ("message" in patch) {
        const name = String(patch.message || "");
        const ref = name ? rootNamed(element, "bpmn:Message", "Message_", "name", name, { name }) : undefined;
        if (bo.$type === "bpmn:ReceiveTask") modeling.updateProperties(element, { messageRef: ref });
        else if (found) modeling.updateModdleProperties(element, found, { messageRef: ref });
      }
      if (!found) return;
      if (patch.timer) {
        const kind = String(patch.timer.kind || "");
        const props = {};
        for (const k of TIMER_KINDS) props[k] = undefined;
        if (TIMER_KINDS.includes(kind)) {
          props[kind] = moddle.create("bpmn:FormalExpression", { body: String(patch.timer.value || "") });
        }
        modeling.updateModdleProperties(element, found, props);
      }
      if ("signal" in patch) {
        const name = String(patch.signal || "");
        const ref = name ? rootNamed(element, "bpmn:Signal", "Signal_", "name", name, { name }) : undefined;
        modeling.updateModdleProperties(element, found, { signalRef: ref });
      }
      if ("error" in patch) {
        // 코드가 비면 **코드 없는 경계** — 모든 업무 실패를 받는다 (C14).
        const code = String(patch.error || "");
        const ref = code
          ? rootNamed(element, "bpmn:Error", "Error_", "errorCode", code, { name: code, errorCode: code })
          : undefined;
        modeling.updateModdleProperties(element, found, { errorRef: ref });
      }
    };

    const api = {
      async importXML(xml) {
        const laid = await laidOutXml(xml);
        const found = await modeler.importXML(laid.xml);
        centerAtNormalZoom(modeler.get("canvas"));
        // 배치했으면 디스크와 다르다 — 「저장 안 한 변경」으로 둔다(창이 `laid_out`을 보고 표시한다).
        dirty = laid.laidOut;
        return {
          warnings: (found.warnings || []).map((w) => String(w.message || w)),
          laid_out: laid.laidOut,
        };
      },
      async saveXML() {
        const { xml } = await modeler.saveXML({ format: true });
        dirty = false;
        return { xml };
      },
      async createEmpty(processId, name) {
        await modeler.createDiagram();
        const registry = modeler.get("elementRegistry");
        const process = registry.find((e) => e.type === "bpmn:Process");
        if (process) {
          modeler.get("modeling").updateProperties(process, { id: processId, name });
        }
        dirty = false;
        return { ok: true };
      },
      /** 「BPM 프로세스 닫기」 — 그림을 내린다 (다음 `importXML`·`createEmpty`가 다시 채운다). */
      async clear() {
        modeler.clear();
        dirty = false;
        return { ok: true };
      },
      async undo() { modeler.get("commandStack").undo(); return { ok: true }; },
      async redo() { modeler.get("commandStack").redo(); return { ok: true }; },
      /** STU-04가 읽는 것 — 이름·설명·조건식·스크립트와 `chk:*` 본문(JSON 글 그대로). */
      async properties(id) {
        const element = modeler.get("elementRegistry").get(id);
        if (!element) return { found: false };
        const bo = element.businessObject;
        const chk = {};
        for (const one of (bo.extensionElements && bo.extensionElements.values) || []) {
          if (!String(one.$type).startsWith("chk:")) continue;
          const name = toName(one.$type);
          if (name === "task") {
            // `chk:task`만 `type`·`extension`이 XML 속성이다 (C14) — 본문과 함께 싣는다.
            let data = {};
            try { data = JSON.parse(one.value || "{}"); } catch (e) { data = one.value || {}; }
            chk[name] = JSON.stringify(
              { type: one.type || "", extension: one.extension || "", data },
              null, 2,
            );
          } else {
            chk[name] = one.value || "";
          }
        }
        return {
          found: true,
          id: bo.id,
          type: String(bo.$type || "").replace("bpmn:", ""),
          name: bo.name || "",
          documentation: (bo.documentation || []).map((d) => d.text || "").join("\n"),
          condition: (bo.conditionExpression && bo.conditionExpression.body) || "",
          script: bo.script || "",
          // 호출(`callActivity`)이 부르는 것 — 표준 속성이라 `chk`와 따로 싣는다 (STU-04 「호출」).
          calledElement: bo.calledElement || "",
          // 반복 표시 — 표준 `multiInstanceLoopCharacteristics` (STU-04 「반복」, C14 §반복).
          multiInstance: multiInstanceOf(bo),
          // 게이트웨이의 기본 흐름·흐름 요약 (STU-04 「게이트웨이」) — 게이트웨이가 아니면 `null`.
          gateway: gatewayOf(bo),
          // 이벤트 정의의 칸 (STU-04 「이벤트」·「받기」) — 이벤트·받기 태스크가 아니면 `null`.
          event: eventOf(bo),
          chk,
        };
      },
      /**
       * STU-04의 「적용」. **bpmn-js의 modeling으로 고친다** — 그래야 실행 취소와
       * 「저장 안 한 변경」이 함께 움직인다 (XML을 우리가 직접 만지면 둘 다 깨진다).
       */
      async setProperties(id, patch) {
        const element = modeler.get("elementRegistry").get(id);
        if (!element) return { found: false };
        const modeling = modeler.get("modeling");
        const moddle = modeler.get("moddle");
        const bo = element.businessObject;

        // 표준 속성은 **한 번에** 바꾼다 — 실행 취소가 한 걸음이 되게.
        const plain = {};
        if ("name" in patch) plain.name = patch.name;
        if ("documentation" in patch) {
          const text = String(patch.documentation || "");
          plain.documentation = text ? [moddle.create("bpmn:Documentation", { text })] : [];
        }
        if ("condition" in patch) {
          const body = String(patch.condition || "");
          plain.conditionExpression = body ? moddle.create("bpmn:FormalExpression", { body }) : undefined;
        }
        if ("script" in patch) plain.script = String(patch.script || "");
        if ("calledElement" in patch) plain.calledElement = String(patch.calledElement || "") || undefined;
        if ("multiInstance" in patch) {
          const mode = String(patch.multiInstance || "");
          const had = bo.loopCharacteristics;
          if (!mode) {
            plain.loopCharacteristics = undefined;
          } else if (had && had.$type === "bpmn:MultiInstanceLoopCharacteristics") {
            // 있던 표시는 갈아 끼우지 않는다 — 안쪽에 적힌 것이 있으면 남긴다.
            if (multiInstanceOf(bo) !== mode) {
              modeling.updateModdleProperties(element, had, { isSequential: mode === "sequential" });
            }
          } else {
            plain.loopCharacteristics = moddle.create("bpmn:MultiInstanceLoopCharacteristics", {
              isSequential: mode === "sequential",
            });
          }
        }
        if ("default" in patch) {
          // 게이트웨이의 기본 흐름 — 흐름 id로 오고 그 흐름을 가리킨다 (빈 글이면 기본 없음).
          const flow = modeler.get("elementRegistry").get(String(patch.default || ""));
          plain.default = flow ? flow.businessObject : undefined;
        }
        if (Object.keys(plain).length) modeling.updateProperties(element, plain);
        if (patch.event) setEvent(element, patch.event);

        if (patch.chk) {
          let holder = bo.extensionElements;
          if (!holder) {
            holder = moddle.create("bpmn:ExtensionElements", { values: [] });
            modeling.updateProperties(element, { extensionElements: holder });
          }
          for (const [name, text] of Object.entries(patch.chk)) {
            const type = toType(name);
            const found = (holder.values || []).find((v) => String(v.$type) === type);
            if (text === null) {
              if (found) {
                modeling.updateModdleProperties(element, holder, {
                  values: holder.values.filter((v) => v !== found),
                });
              }
              continue;
            }
            // `chk:task`는 속성과 본문으로 갈라 쓴다 (C14).
            const attrs = chkAttrs(name, text);
            if (found) {
              modeling.updateModdleProperties(element, found, attrs);
            } else {
              const made = moddle.create(type, attrs);
              modeling.updateModdleProperties(element, holder, {
                values: [...(holder.values || []), made],
              });
            }
          }
        }
        return { found: true };
      },
      /**
       * STU-03 「캔버스에 추가」 — 리소스 탐색기가 고른 것으로 노드 하나를 만든다.
       *
       * **`chk:*`를 businessObject에 미리 달고 한 번에 만든다** — 만든 뒤에 고치면
       * 실행 취소가 두 걸음이 된다 (`setProperties`가 지키는 규칙과 같다).
       */
      async createTask(spec) {
        const type = String((spec && spec.bpmn) || "bpmn:ServiceTask");
        const canvas = modeler.get("canvas");
        const shape = modeler.get("elementFactory").createShape({ type, businessObject: makeBo(spec) });
        const at = (spec && spec.at)
          ? spotAt(canvas, spec.at)
          : freeSpot(canvas, modeler.get("elementRegistry"), shape);
        const made = modeler.get("modeling").createShape(shape, at, canvas.getRootElement());
        modeler.get("selection").select(made);
        // 가운데를 함께 돌려준다 — 끌어다 놓은 자리에 **정말** 생겼는지 시험이 본다.
        return { id: made.id, x: made.x + made.width / 2, y: made.y + made.height / 2 };
      },
      /**
       * STU-06a — 빈 그림의 시작 이벤트 뒤에 노드들을 **이어 붙인다** (ADR-0071).
       * `autoPlace`가 자리와 흐름을 함께 만든다 — 파이썬이 XML을 짓지 않는다.
       */
      async appendChain(specs) {
        const registry = modeler.get("elementRegistry");
        const autoPlace = modeler.get("autoPlace");
        const factory = modeler.get("elementFactory");
        let at = registry.find((e) => e.type === "bpmn:StartEvent");
        if (!at) throw new Error("시작 이벤트가 없다");
        const ids = [];
        for (const spec of specs || []) {
          const type = String((spec && spec.bpmn) || "bpmn:ServiceTask");
          at = autoPlace.append(at, factory.createShape({ type, businessObject: makeBo(spec) }));
          ids.push(at.id);
        }
        return { ids };
      },
      /**
       * STU-06a — 노드 하나를 **위임 호출로 바꾼다** (ADR-0071). 흐름·경계 이벤트는 그대로다
       * (`bpmnReplace`). 명령 하나로 묶어 **실행 취소가 한 걸음**이다.
       */
      async delegateNode(id, spec) {
        const element = modeler.get("elementRegistry").get(id);
        if (!element) return { found: false };
        const context = { element, spec: spec || {} };
        modeler.get("commandStack").execute("chk.delegateNode", context);
        return { found: true, id: context.made.id };
      },
      async select(id) {
        const found = modeler.get("elementRegistry").get(id);
        if (found) modeler.get("selection").select(found);
        return { ok: Boolean(found) };
      },
      async stats() {
        const box = modeler.get("canvas").viewbox();
        return {
          elements: modeler.get("elementRegistry").getAll().length,
          dirty,
          // 보이는 자리 — 시험이 「보통 크기로 가운데에 떴나」를 본다.
          scale: box.scale,
          view: { x: box.x, y: box.y, width: box.width, height: box.height },
          inner: { x: box.inner.x, y: box.inner.y, width: box.inner.width, height: box.inner.height },
        };
      },
      /** 노드에 상태 색을 입힌다 (실행 표시, STU-09). `states`는 {노드 id: 상태}. */
      async mark(states) {
        const canvas = modeler.get("canvas");
        for (const element of modeler.get("elementRegistry").getAll()) {
          for (const name of ["chk-running", "chk-done", "chk-failed", "chk-waiting"]) {
            canvas.removeMarker(element.id, name);
          }
        }
        for (const [id, state] of Object.entries(states || {})) {
          if (modeler.get("elementRegistry").get(id)) canvas.addMarker(id, `chk-${state}`);
        }
        return { ok: true };
      },
    };

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.bridge;
      window.chk = (requestId, name, argsJson) => {
        const run = api[name];
        if (!run) {
          bridge.result(requestId, JSON.stringify({ ok: false, error: `모르는 함수다: ${name}` }));
          return;
        }
        run(...JSON.parse(argsJson))
          .then((found) => bridge.result(requestId, JSON.stringify({ ok: true, ...found })))
          .catch((e) => bridge.result(requestId, JSON.stringify({ ok: false, error: String((e && e.message) || e) })));
      };
      bridge.ready();
    });
  }
  boot();
</script>
</body>
</html>
