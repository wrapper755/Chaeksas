[project]
name = "chaeksas-studio"
version = "0.1.0"
description = "Studio — BPM 프로세스 편집, 시험 실행(자율 수행), 학습, 패키지 빌드·업로드"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chaeksas-core",
    "chaeksas-qt",
    # 캔버스는 QtWebEngine 안의 bpmn-js다 (ADR-0022). WebEngine·WebChannel은 addons에 있다 —
    # `pyside6-essentials`만으로는 뜨지 않는다. 설치 크기는 ADR-0022가 받아들인 값이다.
    "pyside6-addons>=6.8",
    "platformdirs>=4.3",  # 사용자 데이터 위치 (이 PC Bot UI의 Worker 자리도 같은 규칙으로 찾는다)
    "keyring>=25.4",      # 키 참조를 OS 비밀 저장소에서 푼다 (ADR-0013 — 개발용 키)
]

[project.scripts]
chk-studio = "chaeksas.studio.__main__:main"

[tool.uv.sources]
chaeksas-core = { workspace = true }
chaeksas-qt = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# chaeksas는 PEP 420 네임스페이스 — src/chaeksas 밑에 __init__.py를 두지 않는다
packages = ["src/chaeksas"]
