[project]
name = "chaeksas-admin"
version = "0.1.0"
description = "Admin — 서명 키, 패키지 승인·배포 서명 (C2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chaeksas-contracts",
    "chaeksas-qt",        # Admin UI (ADR-0089) — 테마·공용 위젯
    "httpx>=0.27",
    "keyring>=25.4",      # OS 비밀 저장소 — Center 관리자 토큰 (CLAUDE.md §5)
    "platformdirs>=4",
]

[project.scripts]
chk-admin = "chaeksas.admin.cli:main"
chk-admin-ui = "chaeksas.admin.ui:main"

[tool.uv.sources]
chaeksas-contracts = { workspace = true }
chaeksas-qt = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# chaeksas는 PEP 420 네임스페이스 — src/chaeksas 밑에 __init__.py를 두지 않는다
packages = ["src/chaeksas"]
