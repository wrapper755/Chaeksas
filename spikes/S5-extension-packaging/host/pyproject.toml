[project]
name = "chaeksas-s5host"
version = "0.1.0"
description = "S5 시험용 호스트 — Bot UI·Studio 흉내. 확장을 엔트리 포인트로만 찾는다 (특정 확장을 import하지 않는다)"
requires-python = ">=3.12,<3.13"
dependencies = ["pyside6>=6.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaeksas"]
